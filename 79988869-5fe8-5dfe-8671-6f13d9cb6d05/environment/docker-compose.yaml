# Sandbox hardening override (auto-loaded by harbor): grant NET_ADMIN so the base image's
# ENTRYPOINT egress-lockdown can enforce proxy-only egress (model proxy reachable; pypi/github
# blocked so a root agent cannot re-fetch the deleted generator source). extra_hosts wires the
# host-gateway the lockdown allowlists.
services:
  main:
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
